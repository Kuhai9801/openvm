name: RV32IM AOT Repros

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to test
        required: true
        default: aot-rv32im-repros

env:
  CARGO_TERM_COLOR: always
  OPENVM_FAST_TEST: "1"
  OPENVM_SKIP_DEBUG: "1"

jobs:
  repros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AUIPC AOT repro
            test: aot_auipc_preserves_full_24_bit_transpiled_immediate
          - name: x0 unsigned-load AOT repro
            test: aot_unsigned_load_to_x0_preserves_zero_register
          - name: dead-PC dispatch AOT repro
            test: aot_dispatch_rejects_dead_pc_slot
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run ${{ matrix.name }}
        run: |
          cargo test -p openvm-rv32im-circuit --features aot ${{ matrix.test }} -- --nocapture
